name: Continuous Deployment (CD) & Canister Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_network:
        description: 'Target Deployment Network'
        required: true
        default: 'ic'
        type: choice
        options:
          - 'ic'
          - 'staging'

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Build & Verify Canister Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Canister Rust Compilation
        run: |
          cargo check --workspace --all-targets

      - name: Build Canister WebAssembly Targets
        run: |
          cargo build --target wasm32-unknown-unknown --release

      - name: Compute Artifact Cryptographic Hashes
        run: |
          mkdir -p target/wasm-dist
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" -exec cp {} target/wasm-dist/ \;
          cd target/wasm-dist
          test -n "$(find . -maxdepth 1 -name '*.wasm' -print -quit)"
          sha256sum ./*.wasm > sha256_checksums.txt
          cat sha256_checksums.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Reality Gate
        run: |
          python scripts/check.py

  canister-deploy-gate:
    name: Read-only Mainnet Release Readiness Gate
    needs: validate-and-build
    # Never run production readiness on push; mainnet deployment is out of scope.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_network == 'ic' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify production prerequisites without disclosing secrets or deploying
        env:
          HAS_PRODUCTION_IDENTITY: ${{ secrets.IC_PRODUCTION_IDENTITY != '' }}
          HAS_CYCLES_WALLET: ${{ secrets.IC_CYCLES_WALLET_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(Path("STATUS.json").read_text())
          blockers = []
          if os.environ.get("HAS_PRODUCTION_IDENTITY") != "true":
              blockers.append("Production identity GitHub secret not configured")
          if os.environ.get("HAS_CYCLES_WALLET") != "true":
              blockers.append("Cycles wallet GitHub secret not configured")
          if status.get("mainnet_deployment", {}).get("third_party_audit_completed") is not True:
              blockers.append("Independent third-party audit evidence not recorded")
          if blockers:
              print("MAINNET RELEASE BLOCKED:")
              for blocker in blockers:
                  print(" -", blocker)
              raise SystemExit(2)
          print("Credential presence and recorded audit prerequisites confirmed.")
          print("NO DEPLOYMENT EXECUTED. Independent verification and authorization still required.")
          PY
